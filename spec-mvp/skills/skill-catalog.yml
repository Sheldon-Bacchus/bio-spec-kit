schema_version: "1.0"

catalog:
  purpose: "Initial project-level skill allowlist for the bio-spec-kit MVP"
  source_root: "vendor/sources"
  runtime_discovery: ".agents/skills"
  staging_root: "spec-mvp/skills"
  policy: "Use adapters and selected references; do not copy an upstream repository wholesale."
  skills:
    - id: "bulk-pa-luad"
      category: "tool-usage-and-result-interpretation"
      source:
        - "vendor/sources/bioSkills/differential-expression/edger-basics"
        - "vendor/sources/bioSkills/expression-matrix/metadata-joins"
      executable: "Rscript"
      libraries: ["edgeR", "limma"]
      workflow_phases: ["design-check", "count-model", "paired-check", "handoff"]
      preset: "edgeR-QL + paired limma/block design; explicit subject and contrast"
      exceptions: ["ambiguous pairing", "singular design", "non-integer counts", "missing R libraries"]
      status: "staged-adapter"
    - id: "cross-branch-integration"
      category: "workflow-control-and-result-interpretation"
      source:
        - "vendor/sources/bioSkills/multi-omics-integration/integration-design"
        - "vendor/sources/bioSkills/multi-omics-integration/data-harmonization"
      executable: "Rscript"
      libraries: ["MultiAssayExperiment (when joint container is required)"]
      workflow_phases: ["question-classification", "sample-map", "ID-harmonization", "intersection", "direction-stratification", "validation-gate"]
      preset: "descriptive gene intersection and direction strata; no automatic joint model"
      exceptions: ["inferred sample correspondence", "namespace mismatch", "confounded batch", "no held-out validation for predictive claims"]
      status: "staged-adapter"
    - id: "pathway-enrichment"
      category: "tool-usage-and-result-interpretation"
      source:
        - "vendor/sources/scientific-agent-skills/skills/pathway-enrichment"
        - "vendor/sources/bioSkills/pathway-analysis/go-enrichment"
        - "vendor/sources/bioSkills/pathway-analysis/kegg-pathways"
      executable: "Rscript"
      libraries: ["clusterProfiler", "OrgDb/GO.db as applicable"]
      workflow_phases: ["method-fork", "ID-mapping", "universe-audit", "ORA-or-GSEA", "redundancy-review", "handoff"]
      preset: "ORA with tested universe; GSEA only with complete ranking; GO ontology explicit"
      exceptions: ["missing universe", "unexplained mapping loss", "no rank for GSEA", "un-pinned live KEGG"]
      status: "staged-adapter"
    - id: "wgcna-module-constraint"
      category: "tool-usage-and-result-interpretation"
      source:
        - "vendor/sources/bioSkills/gene-regulatory-networks/coexpression-networks"
      executable: "Rscript"
      libraries: ["WGCNA"]
      workflow_phases: ["sample-gene-QC", "signed-network", "module-detection", "trait-association", "stability-gate", "pathway-handoff"]
      preset: "signed WGCNA with explicit power, kME hubs, and stability requirement"
      exceptions: ["small cohort", "singular design", "network-type mismatch", "unverified preservation"]
      status: "staged-adapter"
    - id: "multiqc"
      category: "tool-usage-and-workflow-control"
      source:
        - "vendor/sources/bioSkills/reporting/automated-qc-reports"
        - "vendor/sources/MultiQC"
      executable: "extensions/bio-multiqc/scripts/run_multiqc.py -> .venv/Scripts/multiqc.exe"
      version: "1.35"
      workflow_phases: ["bounded-input", "multiqc-run", "artifact-check", "human-review"]
      preset: "JSON data enabled, AI summary off, fixture marker and expected sources checked"
      exceptions: ["missing executable", "no intended parser match", "missing JSON/source map", "fixture marker absent", "sensitive data with network mode"]
      status: "executable-mvp"
