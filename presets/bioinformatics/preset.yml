schema_version: "1.0"

preset:
  id: "bioinformatics"
  name: "Bioinformatics Evidence-First Workflow"
  version: "0.1.0"
  description: "Templates and prompts for reproducible, reviewable bioinformatics projects."
  author: "Sheldon-Bacchus"
  repository: "https://github.com/Sheldon-Bacchus/bio-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.14.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Bioinformatics governance and reproducibility principles"
      replaces: "constitution-template"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Scientific question, inputs, outputs, and acceptance criteria"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Pipeline, statistical, environment, and provenance plan"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Evidence-bearing tasks with validation and review ownership"
      replaces: "tasks-template"
    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Pre-run, QC, statistical, and release checklist"
      replaces: "checklist-template"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create a scientific specification"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan a reproducible analysis"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Check scientific and artifact consistency"
      replaces: "speckit.analyze"

tags:
  - "bioinformatics"
  - "reproducibility"
  - "quality-control"
  - "scientific-workflow"

