schema_version: "1.0"

workflow:
  id: "bio-research-mvp"
  name: "Bio Research Spec Kit MVP"
  version: "0.1.0"
  author: "Sheldon-Bacchus"
  description: "Official Spec Kit planning lifecycle followed by one bounded, reviewable MultiQC execution slice."

requires:
  speckit_version: ">=0.14.0"
  integrations:
    any: ["claude", "codex", "copilot", "generic"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the research feature or analysis decision"
  integration:
    type: string
    default: "auto"
    prompt: "Spec Kit integration (auto uses the initialized project integration)"
  multiqc_input:
    type: string
    required: true
    default: "tests/fixtures/multiqc"
    prompt: "Bounded input directory for the execution slice"
  multiqc_output:
    type: string
    required: true
    default: ".bio/runs/current/multiqc"
    prompt: "Run output directory"
  multiqc_config:
    type: string
    required: true
    default: ".specify/extensions/bio-multiqc/config/multiqc_config.yaml"
  multiqc_bin:
    type: string
    default: "multiqc"
  multiqc_preset:
    type: string
    default: "generic"
    enum: ["generic", "fastqc-multiqc-mvp"]
  release_verdict:
    type: string
    default: ""
    enum: ["", "approve", "reject"]

steps:
  - id: "specify"
    command: "speckit.specify"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "review-spec"
    type: "gate"
    message: "Review the generated research specification before planning."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "plan"
    command: "speckit.plan"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "review-plan"
    type: "gate"
    message: "Review the research design and execution plan before task generation."
    options: ["approve", "reject"]
    on_reject: "abort"

  - id: "tasks"
    command: "speckit.tasks"
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: "multiqc-run"
    type: "shell"
    run: "python .specify/extensions/bio-multiqc/scripts/run_multiqc.py --input \"{{ inputs.multiqc_input }}\" --output \"{{ inputs.multiqc_output }}\" --config \"{{ inputs.multiqc_config }}\" --multiqc-bin \"{{ inputs.multiqc_bin }}\" --preset \"{{ inputs.multiqc_preset }}\""

  - id: "review-execution"
    type: "gate"
    message: "Review the verified MultiQC report and JSON verdict before release."
    show_file: "{{ inputs.multiqc_output }}/multiqc-review.md"
    options: ["approve", "reject"]
    on_reject: "abort"
    verdict_input: "release_verdict"

  - id: "record-review"
    type: "shell"
    run: "python .specify/extensions/bio-review/scripts/record_approval.py --stage multiqc --decision \"{{ steps.review-execution.output.choice }}\" --evidence \"{{ inputs.multiqc_output }}/multiqc-verdict.json\""
