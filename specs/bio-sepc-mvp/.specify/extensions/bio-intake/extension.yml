schema_version: "1.0"

extension:
  id: "bio-intake"
  name: "Bioinformatics Intake"
  version: "0.1.0"
  description: "Validate project manifests and sample metadata before analysis."
  author: "Sheldon-Bacchus"
  repository: "https://github.com/Sheldon-Bacchus/bio-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.14.0"

provides:
  commands:
    - name: "speckit.bio-intake.preflight"
      file: "commands/preflight.md"
      description: "Validate the bioinformatics intake contract"
  scripts:
    - name: "bio-intake-validate"
      file: "scripts/validate.py"
  templates:
    - name: "bio-intake-report"
      file: "templates/intake-report.md"

tags:
  - "bioinformatics"
  - "metadata"
  - "validation"

