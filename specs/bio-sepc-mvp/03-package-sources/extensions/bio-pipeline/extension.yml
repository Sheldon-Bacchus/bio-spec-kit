schema_version: "1.0"

extension:
  id: "bio-pipeline"
  name: "Bioinformatics Pipeline Runner"
  version: "0.1.0"
  description: "Run a versioned Nextflow or Snakemake pipeline without shell interpolation."
  author: "Sheldon-Bacchus"
  repository: "https://github.com/Sheldon-Bacchus/bio-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.14.0"
  tools:
    - name: "nextflow"
      required: false
    - name: "snakemake"
      required: false

provides:
  commands:
    - name: "speckit.bio-pipeline.run"
      file: "commands/run.md"
      description: "Run the selected pipeline engine"
  scripts:
    - name: "bio-pipeline-run"
      file: "scripts/run_pipeline.py"

tags:
  - "bioinformatics"
  - "nextflow"
  - "snakemake"
  - "execution"

