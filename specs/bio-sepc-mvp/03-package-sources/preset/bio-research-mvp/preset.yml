schema_version: "1.0"

preset:
  id: "bio-research-mvp"
  name: "Bio Research Spec Kit MVP"
  version: "0.1.0"
  description: "Official Spec Kit templates with a small, evidence-aware research profile."
  author: "Sheldon-Bacchus"
  repository: "https://github.com/Sheldon-Bacchus/bio-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=0.14.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec Kit feature specification with scientific question and evidence boundaries"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Spec Kit implementation plan with research design and provenance gates"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Spec Kit tasks with validation commands and evidence paths"
      replaces: "tasks-template"
    - type: "contract"
      name: "research-core-profile"
      file: "contracts/research-core-profile.yml"
      description: "Bounded Research Core/Bio profile ownership and evidence boundary"

  component_contract_bindings:
    - component_id: "multiqc"
      skill: "spec-mvp/skills/multiqc/SKILL.md"
      contract: "specs/005-skills-nextflow-research-core/contracts/multiqc/node.contract.json"
      profile: "contracts/research-core-profile.yml"
      status: "approved-design / bounded-slice-remediated / reusable-core-not-generalized"

tags:
  - "bioinformatics"
  - "research"
  - "evidence"
  - "mvp"
