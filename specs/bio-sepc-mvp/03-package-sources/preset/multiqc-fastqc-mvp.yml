schema_version: "1.0"

preset:
  id: "fastqc-multiqc-mvp"
  name: "FastQC fixture through MultiQC"
  input_kind: "fastqc"
  multiqc_modules: ["fastqc"]
  filename: "multiqc_report.html"
  data_format: "json"
  require_html: true
  require_machine_data: true
  require_source_map: true
  verify_fixture_values: true
  expected:
    samples: 1
    sample: "test_R1"
    total_sequences: 10000
    sequence_length: 100
    percent_gc: 48
  policy:
    ai_summary: "off"
    network: "not_required"
    output_directory: "fresh-or-explicit-overwrite"
