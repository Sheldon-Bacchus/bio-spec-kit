name: candidate-record
version: 1
description: 一个科研或生信 Agent 能力的证据记录。
required:
  - id
  - name
  - domain
  - source_url
  - scope
  - invocation_class
  - observation_date
  - evidence
  - invocation
  - score
  - integration
properties:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]+$"
  name:
    type: string
  domain:
    type: enum
    values:
      - scientific-general
      - bioinformatics
  source_url:
    type: url
  scope:
    type: object
    required:
      - included
      - excluded
  invocation_class:
    type: enum
    values:
      - skill-file
      - cli
      - mcp
      - api
      - notebook
      - pipeline-wrapper
      - knowledge-reference
  observation_date:
    type: date
    format: YYYY-MM-DD
  evidence:
    type: reference
    contract: evidence-record
  invocation:
    type: reference
    contract: invocation-contract
  score:
    type: reference
    contract: scoring-record
  integration:
    type: object
    required:
      - tier
      - target_type
      - evidence_gaps
      - required_gates
    tier_values:
      - preferred-pilot
      - wrapper-needed
      - reference-only
      - exclude
  safety:
    type: object
    required:
      - network
      - sensitive_data
      - credentials
      - default_permissions
      - critical_failures
