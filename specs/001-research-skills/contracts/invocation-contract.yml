name: invocation-contract
version: 1
description: 面向 Agent 的调用合同，用于调用已批准或进入试点的能力。
required:
  - entrypoint
  - input_schema
  - output_schema
  - side_effects
  - permissions
  - failure_policy
  - provenance_outputs
  - human_gate
properties:
  entrypoint:
    type: string
    description: 确切的 Skill 路径、命令、MCP 操作、API 操作或参考动作。
  input_schema:
    type: object
    required:
      - data
      - metadata
      - references
      - parameters
  output_schema:
    type: object
    required:
      - primary_outputs
      - reports
      - logs
      - exit_conditions
  side_effects:
    type: enum
    values:
      - none
      - local-files
      - network-read
      - network-write
      - external-write
      - execution
  permissions:
    type: object
    required:
      - filesystem
      - network
      - credentials
      - write_approval
  failure_policy:
    type: enum
    values:
      - stop
      - report-and-review
      - retry-bounded
      - reference-only
  provenance_outputs:
    type: list
    values:
      - source_url
      - version_or_commit
      - invocation
      - parameters
      - input_manifest
      - output_manifest
      - environment
      - reference_versions
      - network_queries
      - logs
      - hashes
  human_gate:
    type: object
    required:
      - gate_id
      - approval_required
      - approver_role
      - waiver_fields
