name: scoring-record
version: 1
description: 对候选能力进行加权的 0-5 分评估。
weights:
  invocation_contract: 0.20
  scientific_utility: 0.20
  maintenance_adoption: 0.15
  documentation_tests: 0.15
  license: 0.10
  safety_privacy: 0.10
  speckit_fit: 0.10
required:
  - invocation_contract
  - scientific_utility
  - maintenance_adoption
  - documentation_tests
  - license
  - safety_privacy
  - speckit_fit
  - total
  - confidence
  - critical_failures
  - reviewer
  - scored_date
properties:
  each_category:
    type: number
    minimum: 0
    maximum: 5
  total:
    type: number
    minimum: 0
    maximum: 5
    formula: "sum(category_score * weight)"
  confidence:
    type: enum
    values:
      - high
      - medium
      - low
  critical_failures:
    type: list
    allowed_values:
      - unresolved-license
      - undisclosed-sensitive-data-transfer
      - unsafe-default-execution
      - no-reproducible-entrypoint
      - missing-source-evidence
  reviewer:
    type: string
  scored_date:
    type: date
    format: YYYY-MM-DD
admission_rules:
  preferred-pilot:
    minimum_score: 4.0
    critical_failures_allowed: false
  wrapper-needed:
    minimum_score: 3.0
    critical_failures_allowed: false
  reference-only:
    maximum_score: 5.0
    execution_allowed: false
  exclude:
    critical_failure: true
