schema_version: "0.1"
artifact_status: "FROZEN_AUDIT_SHAPE / NOT_RUNTIME"
status_vocabulary:
  - "有"
  - "条件"
  - "无"
  - "待核"
  - "不适用"
  - "未验证"
evidence_vocabulary:
  - FACT
  - INFERENCE
  - PROPOSAL
  - UNKNOWN
record_schema:
  required_fields:
    - component_id
    - kind
    - source_role
    - source_paths
    - primary_stage
    - scientific_purpose
    - estimand_or_observable
    - upstream_inputs
    - preconditions
    - method
    - routes
    - downstream_outputs
    - identity_policy
    - examples_tests
    - provenance
    - hard_boundary
    - failure_recovery
    - runtime_status
    - merge_decision
  field_value_shape: "{status: 有|条件|无|待核|不适用|未验证, value: ...}"
  source_reference_shape: "{ref: repository-relative path or URL, evidence_status: FACT|INFERENCE|PROPOSAL|UNKNOWN}"
records:
  - component_id: "bulk-pa-luad"
    kind: "project-adapter"
    source_role: {status: "有", value: "PRIMARY_LOCAL_SKILL"}
    source_paths:
      status: "有"
      value:
        - "spec-mvp/skills/bulk-pa-luad/SKILL.md"
        - "spec-mvp/skills/bulk-pa-luad/references/"
        - ".agents/skills/bulk-pa-luad/SKILL.md"
    primary_stage: {status: "待核", value: "Bio S04-S06 mapping; canonical S-stage assignment not frozen"}
    scientific_purpose: {status: "有", value: "Estimate condition effects in paired bulk PA/LUAD expression data"}
    estimand_or_observable: {status: "条件", value: "Signed condition contrast effect and multiplicity-adjusted evidence under the declared design; not causal effect"}
    upstream_inputs: {status: "有", value: "Integer count matrix, sample metadata, subject/pairing, condition, contrast, organism/reference namespace, feature estimand"}
    preconditions: {status: "有", value: "Complete metadata join, valid pairing, non-singular design, required R packages, count model compatible input"}
    method: {status: "有", value: "edgeR QL count model with explicit filtering/normalization; limma paired/block check when requested"}
    routes: {status: "有", value: "paired versus repeated-measures design; edgeR count route versus limma continuous-data route"}
    downstream_outputs: {status: "有", value: "Filtered-count manifest, design/contrast record, DE tables, diagnostics, tested-gene universe, provenance"}
    identity_policy: {status: "条件", value: "sample_id, subject_id and contrast_id must be explicit; current adapter documents rather than enforces tuple transport"}
    examples_tests: {status: "条件", value: "R examples and references exist; pinned environment and deterministic end-to-end run are not verified here"}
    provenance: {status: "条件", value: "Skill requires versions, parameters and hashes; current source does not provide a frozen run manifest"}
    hard_boundary: {status: "有", value: "Does not claim a causal effect, replace a paired/repeated design with an unpaired design, or infer results without a valid tested universe"}
    failure_recovery: {status: "有", value: "Fail closed on non-integer counts, incomplete joins, ambiguous pairing, singular design, missing packages or missing universe"}
    runtime_status: {status: "有", value: "staged-adapter / not-verified"}
    merge_decision: {status: "有", value: "merge-view with reference 02-deg; keep algorithm ownership separate"}
    evidence_refs:
      - {ref: "spec-mvp/skills/bulk-pa-luad/SKILL.md", evidence_status: FACT}
      - {ref: "spec-mvp/skills/skill-catalog.yml", evidence_status: FACT}

  - component_id: "cross-branch-integration"
    kind: "project-adapter"
    source_role: {status: "有", value: "PRIMARY_LOCAL_SKILL"}
    source_paths:
      status: "有"
      value:
        - "spec-mvp/skills/cross-branch-integration/SKILL.md"
        - "spec-mvp/skills/cross-branch-integration/references/"
        - ".agents/skills/cross-branch-integration/SKILL.md"
    primary_stage: {status: "待核", value: "Bio S09-S10 mapping; canonical S-stage assignment not frozen"}
    scientific_purpose: {status: "有", value: "Compare or integrate outputs from analysis branches while preserving correspondence and direction"}
    estimand_or_observable: {status: "条件", value: "Descriptive overlap and direction strata; not evidence of shared causal mechanism"}
    upstream_inputs: {status: "有", value: "Branch result tables or matrices, stable sample map, feature namespace, reference release, branch labels and effect convention"}
    preconditions: {status: "有", value: "Provided correspondence, compatible namespace/assembly, comparable effect field, declared cutoff and non-confounded design for joint models"}
    method: {status: "有", value: "Stable-key harmonization, intersection and up/up-down/down strata; joint models remain separate components"}
    routes: {status: "有", value: "shared genes, direction concordance, subtype, latent-axis or predictive-signature question"}
    downstream_outputs: {status: "有", value: "Sample-map audit, matched/unmatched records, intersection, direction strata, per-branch provenance and limitation report"}
    identity_policy: {status: "有", value: "Stable subject_id/sample_id and gene_id namespace; row order is forbidden as correspondence"}
    examples_tests: {status: "条件", value: "Usage guides and diagnostic script exist; independent fixture verification is incomplete"}
    provenance: {status: "条件", value: "Branch-specific source, cutoff and namespace are required; frozen run manifest not verified"}
    hard_boundary: {status: "有", value: "Does not infer correspondence or a shared causal mechanism, and does not own a joint model for the contributing branches"}
    failure_recovery: {status: "有", value: "Block on inferred correspondence, namespace mismatch, missing effect, direction conflict, confounded batch or unsupported predictive claim"}
    runtime_status: {status: "有", value: "staged-adapter / not-verified"}
    merge_decision: {status: "有", value: "compose-only with bulk-pa-luad and reference DE results; integration ownership remains separate"}
    evidence_refs:
      - {ref: "spec-mvp/skills/cross-branch-integration/SKILL.md", evidence_status: FACT}
      - {ref: "tests/fixtures/shared-integration/", evidence_status: FACT}

  - component_id: "multiqc"
    kind: "project-adapter"
    source_role: {status: "有", value: "PRIMARY_LOCAL_SKILL"}
    source_paths:
      status: "有"
      value:
        - "spec-mvp/skills/multiqc/SKILL.md"
        - "extensions/bio-multiqc/scripts/run_multiqc.py"
        - "extensions/bio-multiqc/config/multiqc_config.yaml"
        - ".agents/skills/multiqc/SKILL.md"
    primary_stage: {status: "有", value: "Bio S01 quality-evidence handoff"}
    scientific_purpose: {status: "有", value: "Aggregate bounded upstream QC evidence into a user-openable report and machine-readable artifact"}
    estimand_or_observable: {status: "有", value: "Observed report content, parsed module data and source mapping; not a QC threshold verdict"}
    upstream_inputs: {status: "有", value: "Existing input directory, expected sample/tool manifest, pinned config and fresh output directory"}
    preconditions: {status: "有", value: "Input/config/executable exist, input contains intended module and output is not silently overwritten"}
    method: {status: "有", value: "Project wrapper invokes real MultiQC CLI and checks HTML, JSON, source map, log and fixture-derived values"}
    routes: {status: "有", value: "generic or fastqc-multiqc-mvp preset; required or explicitly visible skip mode"}
    downstream_outputs: {status: "有", value: "HTML report, parsed data, source map, verdict, review note, logs, input/artifact manifests"}
    identity_policy: {status: "条件", value: "Sample/tool identity comes from parsed report and expected manifest; tuple transport is represented in contract, not wrapper API"}
    examples_tests: {status: "有", value: "tests/fixtures/multiqc and wrapper content checks provide a deterministic representative slice"}
    provenance: {status: "有", value: "Wrapper records executable, MultiQC version, command, input manifest and artifact hashes"}
    hard_boundary: {status: "有", value: "Does not define QC thresholds, approve scientific release, or merge report generation with differential-expression inference"}
    failure_recovery: {status: "有", value: "Fail closed on missing input/config/executable, no parser match, missing artifacts or content verification failure; skip is not release-ready"}
    runtime_status: {status: "有", value: "verified for local FastQC/MultiQC wrapper slice; scientific QC and release remain unverified/pending"}
    merge_decision: {status: "有", value: "compose-only with downstream analysis; never merge QC evidence with DE or scientific release"}
    evidence_refs:
      - {ref: "spec-mvp/skills/multiqc/SKILL.md", evidence_status: FACT}
      - {ref: "extensions/bio-multiqc/scripts/run_multiqc.py", evidence_status: FACT}
      - {ref: "tests/fixtures/multiqc/", evidence_status: FACT}
      - {ref: "specs/005-skills-nextflow-research-core/evaluation/runs/multiqc-mvp-20260902/", evidence_status: FACT}

  - component_id: "pathway-enrichment"
    kind: "project-adapter"
    source_role: {status: "有", value: "PRIMARY_LOCAL_SKILL"}
    source_paths:
      status: "有"
      value:
        - "spec-mvp/skills/pathway-enrichment/SKILL.md"
        - "spec-mvp/skills/pathway-enrichment/references/"
        - ".agents/skills/pathway-enrichment/SKILL.md"
    primary_stage: {status: "待核", value: "Bio S10-S11 mapping; canonical S-stage assignment not frozen"}
    scientific_purpose: {status: "有", value: "Interpret executed DE or module results through explicit GO/KEGG enrichment routes"}
    estimand_or_observable: {status: "条件", value: "Enrichment conditional on foreground, tested universe, mapping, method and database; hypothesis-generating only"}
    upstream_inputs: {status: "有", value: "Executed result table or module list, tested universe for ORA, organism, ID namespace, direction, database release/date, method and thresholds"}
    preconditions: {status: "有", value: "Declared ORA/GSEA input shape, shared ID mapping, explicit universe, valid organism/keyType and recorded database state"}
    method: {status: "有", value: "ORA for thresholded list and GSEA for complete ranked list, with mapping audit and explicit ontology/database"}
    routes: {status: "有", value: "ORA versus GSEA; GO ontology; KEGG versus local/frozen database; up/down split"}
    downstream_outputs: {status: "有", value: "Mapping audit, mapped counts, enrichment tables, adjusted p-values, fold enrichment, overlaps, direction and provenance"}
    identity_policy: {status: "条件", value: "gene_id namespace, organism, contrast_id and database release must travel with the result"}
    examples_tests: {status: "条件", value: "R references and failure rules exist; local pinned runtime is not verified"}
    provenance: {status: "有", value: "Database date/release, method, thresholds and mapping loss are required by the Skill"}
    hard_boundary: {status: "有", value: "Does not replace the tested universe, establish causality, or use an unpinned live database as reproducible evidence"}
    failure_recovery: {status: "有", value: "Fail closed on missing universe, incompatible IDs, unexplained mapping loss, missing ranking or unpinned KEGG"}
    runtime_status: {status: "有", value: "staged-adapter / not-verified"}
    merge_decision: {status: "有", value: "compose-only with pathway workflow and database-specific references"}
    evidence_refs:
      - {ref: "spec-mvp/skills/pathway-enrichment/SKILL.md", evidence_status: FACT}
      - {ref: "spec-mvp/skills/reference-stack/04-pathway-workflow/SKILL.md", evidence_status: FACT}

